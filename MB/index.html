<!DOCTYPE html>
<html lang="es" data-theme="principal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lanzador de Dados – El Castillo Vagabundo</title>

  <!-- Tipografías de interfaz (Manual): Roboto + Metamorphous -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Metamorphous&family=Roboto:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-container">
    <!-- Header con marca -->
    <header class="app-header">
      <div class="brand">
        <!-- Cuando tengas el SVG oficial, colócalo en assets/logo-el-castillo-vagabundo.svg -->
        <picture>
          <source srcset="assets/logo-el-castillo-vagabundo.svg" type="image/svg+xml">
          <img class="brand__logo" src="assets/logo-el-castillo-vagabundo.png" alt="El Castillo Vagabundo - Logotipo">
        </picture>
        <div class="brand__text">
          <h1 class="title">El Castillo Vagabundo</h1>
          <p class="subtitle">Lanzador de Dados</p>
        </div>
      </div>
    </header>

    <!-- Panel de resultado (respetando IDs usados por script.js) -->
    <section class="result-display" aria-live="polite">
      <span id="result-text">¡Listo para rodar!</span>
    </section>

    <!-- Controles de dados (respetando IDs y dataset) -->
    <section id="dice-controls" class="dice-grid" aria-label="Selecciona un dado">
      <button class="dice-button" data-sides="4">d4</button>
      <button class="dice-button" data-sides="6">d6</button>
      <button class="dice-button" data-sides="8">d8</button>
      <button class="dice-button" data-sides="10">d10</button>
      <button class="dice-button" data-sides="12">d12</button>
      <button class="dice-button" data-sides="20">d20</button>
      <button class="dice-button" data-sides="100">%</button>
    </section>

    <!-- Historial -->
    <section class="history-container">
      <div class="history-header">
        <h2>Historial</h2>
        <button id="clear-history" class="ghost-btn" title="Limpiar historial">Limpiar</button>
      </div>
      <ul id="history-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
